# claude-remote-kit — tmux.conf
# Tuned for long-running Claude Code sessions you attach to from phones and
# laptops. Every setting has a reason; delete what you disagree with.

# Mouse mode — scroll wheel works on desktop terminals (iTerm2, Ghostty,
# Terminal.app). On Termius iOS, touch scroll through tmux is genuinely flaky:
# use Termius's native Scroll button instead of fighting it.
set -g mouse on

# Bigger scrollback buffer (default is 2000 lines — easy to lose Claude output)
set -g history-limit 50000

# Faster command sequences (default 500ms ESC delay can lag Claude Code)
set -sg escape-time 10

# Keep window numbers contiguous if you close one
set -g renumber-windows on

# Window names: keep what you set with Ctrl-B , — without these two lines tmux
# silently overwrites your names with the foreground process name, and Claude
# Code's process reports its version string, so every window in a multi-Claude
# setup ends up named "2.1.220" and you can't tell them apart.
set -g allow-rename off
set -g automatic-rename off

# Ctrl-B s shows sessions AND their windows expanded (so window names are
# visible; default s shows sessions only)
bind s choose-tree -Zw

# Truecolor (24-bit) so Claude Code's subtle backgrounds render correctly.
# screen-256color caps inner programs at 256 colors and makes tmux down-sample
# 24-bit backgrounds to grays — which shows up as gray boxes behind text.
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"

# Let inner programs (Claude Code) send escape sequences through tmux to the
# outer terminal — needed for inline image protocols and image paste.
set -g allow-passthrough on

# Copy → system clipboard. Mouse-drag a selection, release: clipboard has the
# text. no-clear keeps copy mode active (selection highlighted, view frozen)
# until you press q or scroll to the bottom. Enter copies-and-exits.
# Picks the right clipboard tool per platform: pbcopy (macOS), wl-copy
# (Wayland), xclip (X11). If none is found, OSC-52 set-clipboard still works
# on modern terminals.
set -g set-clipboard on
if-shell 'command -v pbcopy' {
  bind -T copy-mode    MouseDragEnd1Pane send -X copy-pipe-no-clear "pbcopy"
  bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-no-clear "pbcopy"
  bind -T copy-mode    Enter send -X copy-pipe-and-cancel "pbcopy"
  bind -T copy-mode-vi Enter send -X copy-pipe-and-cancel "pbcopy"
}
if-shell 'command -v wl-copy && ! command -v pbcopy' {
  bind -T copy-mode    MouseDragEnd1Pane send -X copy-pipe-no-clear "wl-copy"
  bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-no-clear "wl-copy"
  bind -T copy-mode    Enter send -X copy-pipe-and-cancel "wl-copy"
  bind -T copy-mode-vi Enter send -X copy-pipe-and-cancel "wl-copy"
}
if-shell 'command -v xclip && ! command -v pbcopy && ! command -v wl-copy' {
  bind -T copy-mode    MouseDragEnd1Pane send -X copy-pipe-no-clear "xclip -selection clipboard"
  bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-no-clear "xclip -selection clipboard"
  bind -T copy-mode    Enter send -X copy-pipe-and-cancel "xclip -selection clipboard"
  bind -T copy-mode-vi Enter send -X copy-pipe-and-cancel "xclip -selection clipboard"
}

# Status bar — give the session name room (default status-left-length is 10,
# which truncates anything longer) and separate windows so the list reads
# cleanly.
set -g status-left-length 40
set -g status-right-length 60
set -g status-left "[#{session_name}]  "
set -g status-right " %H:%M %d-%b-%y"
set -g window-status-separator "  "
set -g window-status-format "#I:#W#F"
set -g window-status-current-format "#I:#W#F"
set -g window-status-current-style "fg=black,bg=white,bold"

# Join / break panes with one keystroke
# Ctrl-B J → pull a pane from another window in THIS session into here as a
#            split (prompts for window number, then "beside" or "down")
# Ctrl-B B → break the current pane out into its own window (reverse)
bind J command-prompt -p "window:,beside or down:" "if-shell 'case \"%2\" in [dD]*) exit 0;; *) exit 1;; esac' 'join-pane -v -s :%1' 'join-pane -h -s :%1'"
bind B break-pane
